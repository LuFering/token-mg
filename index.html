<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>多画面叠放 · 压轴满屏</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; overflow: hidden; background: #0b0c0e; }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* ── 底：暖深灰纸面，给整片一个共同光环境 ───────────── */
      .bg {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 84% 76% at 50% 40%,
          #272930 0%, #1b1d22 58%, #111215 100%);
      }
      .bg::after {
        content: ""; position: absolute; inset: 0;
        filter: url(#grain); opacity: .06; mix-blend-mode: overlay;
      }
      .bg::before {
        content: ""; position: absolute; inset: -10%;
        background: repeating-linear-gradient(104deg,
          rgba(255,255,255,.022) 0 1px, transparent 1px 9px);
      }

      /* ── 画面卡 ──────────────────────────────────────────
         绝对定位：白边由 .win 的 inset 做出。
         展开时只改 .win 的 inset，视频始终填满 .win，不会重排/抖动。 */
      .shot {
        position: absolute;
        left: 50%; top: 50%;
        border-radius: 22px;
        background: #faf8f4;
        will-change: transform;
        transform-style: flat;
      }
      .win {
        position: absolute;
        overflow: hidden;
        border-radius: 14px;
        background: #0d0e10;
      }
      .win video, .win .poster {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover; display: block;
      }
      /* 视频起播前显示的静帧，避免卡片窗口是黑块 */
      .win .poster { z-index: 0; }
      .win video { z-index: 1; }
    </style>
  </head>

  <body>
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="11" result="n" />
        <feColorMatrix in="n" type="saturate" values="0" />
      </filter>
    </svg>

    <div id="root" data-composition-id="stack"
         data-start="0" data-width="1920" data-height="1080" data-duration="14.183">

      <div class="bg"></div>

      <!-- 前置画面：窗口 620x465，白边 28 -> 卡 676x521 -->
      <div class="shot" id="s1" style="width:676px;height:521px">
        <div class="win" style="inset:28px" >
          <img class="poster" src="assets/poster/1.jpg" alt="" />
          <video id="v1" data-start="0.8" data-duration="13.383" src="assets/media/1-pad.mp4" muted playsinline></video>
        </div>
      </div>
      <div class="shot" id="s2" style="width:676px;height:521px">
        <div class="win" style="inset:28px">
          <img class="poster" src="assets/poster/2.jpg" alt="" />
          <video id="v2" data-start="2.9" data-duration="11.283" src="assets/media/2-pad.mp4" muted playsinline></video>
        </div>
      </div>
      <div class="shot" id="s3" style="width:676px;height:521px">
        <div class="win" style="inset:28px">
          <img class="poster" src="assets/poster/3.jpg" alt="" />
          <video id="v3" data-start="5.0" data-duration="9.183" src="assets/media/3-pad.mp4" muted playsinline></video>
        </div>
      </div>
      <div class="shot" id="s4" style="width:676px;height:521px" data-layout-allow-overflow>
        <div class="win" style="inset:28px">
          <img class="poster" src="assets/poster/4.jpg" alt="" />
          <video id="v4" data-start="7.1" data-duration="7.083" src="assets/media/4-pad.mp4" muted playsinline></video>
        </div>
      </div>

      <!-- 压轴：窗口 864x486，白边 28 -> 卡 920x542 -->
      <div class="shot" id="s5" style="width:920px;height:542px;border-radius:24px">
        <div class="win" id="w5" style="inset:28px">
          <img class="poster" src="assets/poster/5.jpg" alt="" />
          <video id="v5" data-start="9.2" data-duration="4.983" src="assets/media/5-main.mp4" muted playsinline></video>
        </div>
      </div>
      <!-- 原声：视频 muted，声音走独立 audio；按各卡落定时刻进轨 -->
      <audio id="a1" data-start="0.8" data-duration="0.533" src="assets/voice/1.m4a"
             data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0.0,"v":0.0},{"t":0.04,"v":1.0},{"t":0.463,"v":1.0},{"t":0.533,"v":0.0}]}]}'></audio>
      <audio id="a2" data-start="2.9" data-duration="0.567" src="assets/voice/2.m4a"
             data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0.0,"v":0.0},{"t":0.04,"v":1.0},{"t":0.497,"v":1.0},{"t":0.567,"v":0.0}]}]}'></audio>
      <audio id="a3" data-start="5.0" data-duration="1.0" src="assets/voice/3.m4a"
             data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0.0,"v":0.0},{"t":0.04,"v":1.0},{"t":0.93,"v":1.0},{"t":1.0,"v":0.0}]}]}'></audio>
      <audio id="a4" data-start="7.1" data-duration="0.833" src="assets/voice/4.m4a"
             data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0.0,"v":0.0},{"t":0.04,"v":1.0},{"t":0.763,"v":1.0},{"t":0.833,"v":0.0}]}]}'></audio>
      <audio id="a5" data-start="9.2" data-duration="4.233" src="assets/voice/5.m4a"
             data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0.0,"v":0.0},{"t":0.04,"v":1.0},{"t":4.163,"v":1.0},{"t":4.233,"v":0.0}]}]}'></audio>
    </div>

    <script>
      (function () {
        "use strict";

        var LAY = [
          { id: "s1", at: [634, 318], s: 0.87, rot: -8.5, cue: 0.5, land: 1.3 },
          { id: "s2", at: [1272, 352], s: 0.85, rot: 6.8, cue: 2.6, land: 3.4 },
          { id: "s3", at: [682, 728], s: 0.89, rot: 5.2, cue: 4.7, land: 5.5 },
          { id: "s4", at: [1238, 744], s: 0.86, rot: -6.4, cue: 6.8, land: 7.6 },
          { id: "s5", at: [960, 540], s: 0.9, rot: 0.0, cue: 8.9, land: 9.7 }
        ];
        var ZOOM_AT = 10.9, ZOOM_END = 11.95, TOTAL = 14.183;

        // 单条卡片的落定三拍（升入 -> 过冲 -> 压弹）
        var RISE = 0.5, OVER = 0.22, PRESS = 0.08;
        var HOLD = 1.2, ZOOM = 1.05;

        var tl = gsap.timeline({ paused: true });

        function riseIn(c) {
          var el = document.getElementById(c.id);
          var wx = c.at[0] - 960, wy = c.at[1] - 540;

          var fromX = wx * 0.16;
          var fromY = 580;
          var fromRot = c.rot * -0.38;
          var fromS = c.s * 0.78;

          gsap.set(el, {
            xPercent: -50, yPercent: -50,
            x: fromX, y: fromY, scale: fromS, rotation: fromRot,
            opacity: 0, transformOrigin: "50% 62%"
          });

          var t0 = c.cue;
          tl.set(el, { opacity: 1 }, t0);

          // 升入：expo.out = 快起慢收
          tl.to(el, {
            x: wx, y: wy, scale: c.s, rotation: c.rot,
            duration: RISE, ease: "expo.out"
          }, t0);
          // settle：过冲（y 越过落点 13px）
          tl.to(el, {
            y: wy - 13, scale: c.s * 1.013, rotation: c.rot + c.rot * 0.07,
            duration: OVER, ease: "back.out(2.4)"
          }, t0 + RISE);
          // press：压弹回稳
          tl.to(el, {
            y: wy, scale: c.s, rotation: c.rot,
            duration: PRESS, ease: "power2.out"
          }, t0 + RISE + OVER);

          // 落定后极轻呼吸（判例：拿在手里，不许死）
          var breath = Math.floor((ZOOM_AT - c.land - 0.1) / 0.52);
          if (breath > 0) {
            tl.to(el, {
              y: wy + 5, duration: 0.52, ease: "sine.inOut",
              yoyo: true, repeat: breath - 1
            }, c.land + 0.1);
          }

          // 投影：飞行时大而软，落定后收；投影收敛滞后卡体（拖拽层级）
          var win = el.querySelector(".win");
          tl.fromTo(el, {
            boxShadow: "0 64px 96px rgba(0,0,0,.62), 0 16px 30px rgba(0,0,0,.44)"
          }, {
            boxShadow: "0 30px 52px rgba(0,0,0,.46), 0 7px 16px rgba(0,0,0,.32)",
            duration: RISE, ease: "expo.out"
          }, t0);
          tl.to(el, {
            boxShadow: "0 18px 30px rgba(0,0,0,.40), 0 4px 9px rgba(0,0,0,.28)",
            duration: 0.36, ease: "power2.out"
          }, t0 + RISE + OVER * 0.55);

          // 前四张：压轴卡放大时同步淡出，避免它的白边在中央卡周围形成一圈白框
          if (c.id !== "s5") {
            tl.to(el, { opacity: 1, duration: 0.001 }, ZOOM_AT);
            tl.to(el, {
              opacity: 0,
              duration: ZOOM * 0.55,
              ease: "power1.in"
            }, ZOOM_AT + ZOOM * 0.20);
          }

          return el;
        }

        LAY.forEach(function (c) { riseIn(c); });
        var heroEl = document.getElementById("s5");
        var HERO = LAY[4];

        // ── 压轴：停留呼吸 → 平滑放大铺满 ──────────────────────
        (function () {
          var el = heroEl;
          var wx = HERO.at[0] - 960, wy = HERO.at[1] - 540;
          var win = document.getElementById("w5");

          // 停留期呼吸
          var n = Math.floor(HOLD / 0.5);
          if (n > 0) {
            tl.to(el, {
              y: wy + 4, duration: 0.5, ease: "sine.inOut",
              yoyo: true, repeat: n - 1
            }, HERO.land + 0.08);
          }

          // 展开：把窗口直接开到满画布尺寸，同时卡片缩放到位。
          // 关键：不能只靠 scale —— 白边是卡身上的 28px 环带，
          // 缩放后必然是 62px 的可见边，会在画面四周留白。
          // 正确做法：让窗口自身从 864x486 长到 1920x1080、inset 收到 0，
          // 于是视频真正铺满；卡身的白边被推到画布之外，视觉上"边框消失"。
          // 窗口收 inset 到负值：让窗口**大于**卡片，彻底盖住卡身与圆角边缘，
          // 避免展开完成后画面四边/四角残留一像素的卡片白底。
          tl.to(win, {
            inset: "-4px",
            borderRadius: "0px",
            duration: ZOOM, ease: "power2.inOut"
          }, ZOOM_AT);

          // 卡片尺寸与窗口一并长到画布大小：
          // 窗口 inset:0 时窗口 == 卡片；卡片 1920x1080 且居中于画布，
          // 于是窗口正好覆盖 0..1920 x 0..1080，不会露出任何白边。
          tl.to(el, {
            x: 0, y: 0, scale: 1, rotation: 0,
            width: "1928px", height: "1088px",
            borderRadius: "0px",
            duration: ZOOM, ease: "power2.inOut"
          }, ZOOM_AT);

          // 白底与投影在展开前段就淡掉（0.35 内），避免任何边缘残影
          // 用 gsap.set 直接清掉背景色，避免 background 简写与 backgroundColor 补间打架
          tl.set(el, { background: "none" }, ZOOM_AT);
          tl.to(el, { boxShadow: "0 0 0 rgba(0,0,0,0)", duration: ZOOM * 0.4, ease: "power1.out" },
                ZOOM_AT + ZOOM * 0.08);
        })();

        window.__timelines["stack"] = tl;
      })();
    </script>
  </body>
</html>
