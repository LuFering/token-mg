<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hyperframes/shader-transitions@0.8.83/dist/index.global.js"></script>
    <style>
      /* 字体本地化：自动解析白名单里没有这三个，必须自己声明。
         中文用 text= 子集化（只含本片用到的字，19KB），避免塞进整个 CJK 字体。 */
      @font-face { font-family: "Big Shoulders Display"; font-style: normal; font-weight: 800;
        src: url("assets/fonts/big-shoulders-800.woff2") format("woff2"); font-display: block; }
      @font-face { font-family: "Noto Serif SC"; font-style: normal; font-weight: 900;
        src: url("assets/fonts/noto-serif-sc-900.woff2") format("woff2"); font-display: block; }
      @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 500;
        src: url("assets/fonts/plex-mono-500.woff2") format("woff2"); font-display: block; }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden; background: #0b0a08;
      }
      .scene {
        position: absolute; top: 0; left: 0;
        width: 1920px; height: 1080px; overflow: hidden;
      }
      #scene-1 { background-color: #0b0a08; }
      #scene-2 { background-color: #0b0a08; opacity: 0; }

      /* ── 幕底：暖调近黑 + 油膜光泽（有机、无重复图案） ── */
      .glow-a {
        position: absolute; width: 1500px; height: 1500px; left: 210px; top: -260px;
        background: radial-gradient(circle at 50% 50%, rgba(200,160,60,0.16) 0%, rgba(200,160,60,0.05) 42%, rgba(200,160,60,0) 70%);
        filter: blur(18px);
      }
      .glow-b {
        position: absolute; width: 1200px; height: 900px; left: 980px; top: 420px;
        background: radial-gradient(ellipse at 50% 50%, rgba(62,122,110,0.14) 0%, rgba(62,122,110,0) 68%);
        filter: blur(26px);
      }
      .glow-c {
        position: absolute; width: 900px; height: 700px; left: -180px; top: 520px;
        background: radial-gradient(ellipse at 50% 50%, rgba(91,62,122,0.16) 0%, rgba(91,62,122,0) 70%);
        filter: blur(30px);
      }
      .rule {
        position: absolute; left: 160px; right: 160px; top: 168px; height: 1px;
        background-color: rgba(200,160,60,0.30);
      }
      .grain {
        position: absolute; inset: 0; opacity: 0.5; mix-blend-mode: overlay;
        background-image: repeating-linear-gradient(0deg, rgba(242,237,228,0.035) 0px, rgba(242,237,228,0.035) 1px, rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px);
      }

      /* ── 金属铭牌 ── */
      .plate {
        position: absolute; left: 360px; top: 330px; width: 1200px; height: 420px;
        border-radius: 8px;
        background: linear-gradient(158deg, #1d1915 0%, #131110 46%, #0d0c0b 100%);
        box-shadow:
          inset 0 1px 0 rgba(242,237,228,0.10),
          inset 0 0 0 1px rgba(200,160,60,0.34),
          0 40px 120px rgba(0,0,0,0.75);
      }
      .plate .sheen {
        position: absolute; inset: 0; border-radius: 8px; overflow: hidden;
      }
      .plate .sheen i {
        position: absolute; top: -40%; left: -30%; width: 42%; height: 180%;
        background: linear-gradient(96deg, rgba(240,208,128,0) 0%, rgba(240,208,128,0.18) 48%, rgba(240,208,128,0) 100%);
        transform: rotate(9deg);
      }
      #crack1 { left: 38%; }
      #crack2 { left: 66%; }
      .plate .crack {
        position: absolute; top: 0; bottom: 0; width: 2px;
        background-color: rgba(240,208,128,0.9);
        box-shadow: 0 0 18px rgba(240,208,128,0.75);
        transform-origin: top center;
      }
      .shards { position: absolute; left: 360px; top: 330px; width: 1200px; height: 420px; overflow: visible; }

      /* ── 铸成的方块 ── */
      .cube-wrap { position: absolute; left: 760px; top: 390px; width: 400px; height: 400px; }
      .cube {
        position: absolute; inset: 0; border-radius: 26px;
        background: linear-gradient(152deg, #2a2419 0%, #17130f 48%, #0b0a08 100%);
        box-shadow:
          inset 0 2px 0 rgba(240,208,128,0.30),
          inset 0 0 0 2px rgba(200,160,60,0.55),
          inset 0 -30px 60px rgba(0,0,0,0.6),
          0 0 90px rgba(200,160,60,0.28);
      }
      .cube .stamp {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: 96px;
        letter-spacing: 0.02em; color: #f0d080; text-shadow: 0 0 34px rgba(200,160,60,0.7);
      }
      .shockwave {
        position: absolute; left: 560px; top: 190px; width: 800px; height: 800px; border-radius: 50%;
        border: 2px solid rgba(240,208,128,0.55);
      }

      /* ── 场景 2：3D 方块场 ── */
      .stage {
        position: absolute; inset: 0; perspective: 1400px; perspective-origin: 50% 46%;
      }
      .field { position: absolute; inset: 0; transform-style: preserve-3d; }
      .cell {
        position: absolute; left: 50%; top: 46%; border-radius: 14px;
        background: linear-gradient(152deg, #2e2718 0%, #191510 55%, #100e0b 100%);
        box-shadow:
          inset 0 1px 0 rgba(240,208,128,0.22),
          inset 0 0 0 1px rgba(200,160,60,0.55),
          0 0 34px rgba(200,160,60,0.10);
        transform-style: preserve-3d;
      }
      .ghost {
        position: absolute; left: 0; right: 0; top: 236px; text-align: center;
        font-family: "Noto Serif SC", serif; font-weight: 900; font-size: 300px;
        color: rgba(242,237,228,0.09); letter-spacing: 0.06em; white-space: nowrap;
        z-index: 3; pointer-events: none;
      }
      .hero {
        position: absolute; left: 700px; top: 300px; width: 520px; height: 520px; border-radius: 32px;
        background: linear-gradient(152deg, #2a2419 0%, #17130f 48%, #0b0a08 100%);
        box-shadow:
          inset 0 2px 0 rgba(240,208,128,0.30),
          inset 0 0 0 2px rgba(200,160,60,0.55),
          0 0 130px rgba(200,160,60,0.30);
        display: flex; align-items: center; justify-content: center;
      }
      .hero span {
        font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: 128px;
        color: #f0d080; text-shadow: 0 0 44px rgba(200,160,60,0.75);
      }
      .tally {
        position: absolute; left: 150px; bottom: 150px;
        font-family: "IBM Plex Mono", monospace; font-weight: 500;
      }
      .tally .label { font-size: 16px; letter-spacing: 0.22em; color: #8c8578; }
      .tally .value { font-size: 92px; color: #f2ede4; font-variant-numeric: tabular-nums; line-height: 1.06; }
      .tally .unit { font-size: 22px; color: #c8a03c; margin-left: 12px; letter-spacing: 0.1em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1920" data-height="1080">

      <!-- ══════════ 场景 1 · 承接 + 聚合（0 → 2.6s） ══════════ -->
      <div class="scene" id="scene-1">
        <div class="glow-a" data-no-capture data-layout-allow-overflow></div>
        <div class="glow-b" data-no-capture data-layout-allow-overflow></div>
        <div class="glow-c" data-no-capture data-layout-allow-overflow></div>
        <div class="rule"></div>
        <div class="grain" data-no-capture data-layout-allow-overflow></div>

        <!-- 金属铭牌：上一支片子的收尾字，在这里被"拍"成实体 -->
        <div class="plate" id="plate">
          <div class="sheen" data-layout-allow-overflow><i id="sheen"></i></div>
          <div class="crack" id="crack1"></div>
          <div class="crack" id="crack2"></div>
        </div>
        <!-- 碎片（JS 生成：每片带铭牌文字的一块） -->
        <svg class="shards" id="shards" viewBox="0 0 1200 420"></svg>

        <div class="cube-wrap" id="cube-wrap" style="opacity:0">
          <div class="cube" id="cube"><div class="stamp">TOKEN</div></div>
        </div>
        <div class="shockwave" id="shock" style="opacity:0" data-layout-allow-overflow></div>
      </div>

      <!-- ══════════ 场景 2 · 累积（2.6 → 7s） ══════════ -->
      <div class="scene" id="scene-2">
        <div class="glow-a" style="left: 900px; top: -400px" data-no-capture data-layout-allow-overflow></div>
        <div class="glow-b" style="left: -200px; top: 200px" data-no-capture data-layout-allow-overflow></div>
        <div class="grain" data-no-capture data-layout-allow-overflow></div>
        <div class="ghost" id="ghost">挂在嘴边</div>
        <div class="stage">
          <div class="field" id="field"></div>
        </div>
        <div class="hero" id="hero" style="opacity:0"><span>TOKEN</span></div>
        <div class="tally" id="tally" style="opacity:0">
          <div class="label">MENTIONED IN 2H KEYNOTE</div>
          <div><span class="value" id="tally-value">0</span><span class="unit">次</span></div>
        </div>
      </div>
    </div>

    <script>
      /* ───────── 铭牌碎片：把"Token"这句话切成 18 片 ─────────
         每一片是带裁切路径的 <g>，里面放一份完整的文字 —— 所以每片带着自己那块笔画。
         这是真碎裂，不是把一张图挪来挪去。 */
      (function buildShards() {
        const svg = document.getElementById('shards');
        const NS = 'http://www.w3.org/2000/svg';
        const W = 1200, H = 420, COLS = 6, ROWS = 3;
        // 确定性伪随机（帧可重入）
        let seed = 20260929;
        const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };

        const xs = [0], ys = [0];
        for (let c = 1; c < COLS; c++) xs.push((W / COLS) * c + (rnd() - 0.5) * 60);
        for (let r = 1; r < ROWS; r++) ys.push((H / ROWS) * r + (rnd() - 0.5) * 40);
        xs.push(W); ys.push(H);

        const defs = document.createElementNS(NS, 'defs');
        svg.appendChild(defs);
        const frag = document.createDocumentFragment();

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const id = `clip-${r}-${c}`;
            const cp = document.createElementNS(NS, 'clipPath');
            cp.setAttribute('id', id);
            const poly = document.createElementNS(NS, 'polygon');
            const j = () => (rnd() - 0.5) * 16;
            poly.setAttribute('points', [
              [xs[c] + j(), ys[r] + j()],
              [xs[c + 1] + j(), ys[r] + j()],
              [xs[c + 1] + j(), ys[r + 1] + j()],
              [xs[c] + j(), ys[r + 1] + j()],
            ].map(p => p.map(v => v.toFixed(1)).join(',')).join(' '));
            cp.appendChild(poly); defs.appendChild(cp);

            const g = document.createElementNS(NS, 'g');
            g.setAttribute('class', 'shard');
            g.setAttribute('clip-path', `url(#${id})`);
            const t = document.createElementNS(NS, 'text');
            t.setAttribute('x', W / 2); t.setAttribute('y', H / 2 + 62);
            t.setAttribute('text-anchor', 'middle');
            t.setAttribute('font-family', 'Big Shoulders Display, sans-serif');
            t.setAttribute('font-weight', '900');
            t.setAttribute('font-size', '210');
            t.setAttribute('letter-spacing', '2');
            t.setAttribute('fill', '#f2ede4');
            t.textContent = 'Token';
            g.appendChild(t); frag.appendChild(g);
          }
        }
        svg.appendChild(frag);
      })();

      /* ───────── 场景 2：3D 方块纵深场（70 个，随机深度） ───────── */
      (function buildField() {
        const field = document.getElementById('field');
        let seed = 77003;
        const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
        const frag = document.createDocumentFragment();
        for (let i = 0; i < 70; i++) {
          const d = document.createElement('div');
          d.className = 'cell';
          const size = 90 + rnd() * 120;
          const x = (rnd() - 0.5) * 4200;
          const y = (rnd() - 0.5) * 2400;
          const z = -rnd() * 5200;
          d.style.width = size + 'px';
          d.style.height = size + 'px';
          d.style.marginLeft = (-size / 2) + 'px';
          d.style.marginTop = (-size / 2) + 'px';
          d.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateX(${(rnd() - 0.5) * 26}deg) rotateY(${(rnd() - 0.5) * 34}deg)`;
          // 按深度分层：近的亮、远的暗（空气透视），"无数"才有纵深
          const depth = Math.min(1, Math.max(0, 1 + z / 5200));
          d.style.opacity = String(0.30 + depth * 0.62);
          d.style.filter = `brightness(${0.55 + depth * 0.75})`;
          d.dataset.z = String(z);
          frag.appendChild(d);
        }
        field.appendChild(frag);
      })();

      /* ───────── 时间轴 ───────── */
      const tl = gsap.timeline({ paused: true });

      /* 场景 1 · build（0 → 1.0）：不是从 t=0 开始，先偏移 0.12s */
      tl.fromTo('#plate', { scale: 1.05, filter: 'blur(7px)' },
        { scale: 1, filter: 'blur(0px)', duration: 0.9, ease: 'expo.out' }, 0.12);
      tl.fromTo('#sheen', { xPercent: -170, opacity: 0 },
        { xPercent: 190, opacity: 1, duration: 1.5, ease: 'power2.inOut' }, 0.18);

      /* 裂纹：从顶部向下生长，速度不同 */
      tl.fromTo('#crack1', { scaleY: 0 }, { scaleY: 1, duration: 0.42, ease: 'power4.in' }, 0.62);
      tl.fromTo('#crack2', { scaleY: 0 }, { scaleY: 1, duration: 0.34, ease: 'power4.in' }, 0.74);

      /* 碎裂 → 向心收拢：每片旋转角度、位移、缩放都不同（不许同一个入场） */
      const shards = gsap.utils.toArray('.shard');
      shards.forEach((s, i) => {
        const dir = i % 2 === 0 ? 1 : -1;
        tl.to(s, {
          x: (i % 6 - 2.5) * 14 + dir * 26,
          y: -34 - (i % 3) * 18,
          rotation: dir * (10 + (i % 5) * 7),
          duration: 0.34,
          ease: 'power2.out',
        }, 0.92 + (i % 6) * 0.012 + Math.floor(i / 6) * 0.01);
        tl.to(s, {
          x: 600 - 300,
          y: 210 - 210,
          scale: 0.06,
          rotation: dir * 90,
          opacity: 0,
          duration: 0.5,
          ease: 'power3.inOut',
        }, 1.16 + (i % 6) * 0.01);
      });
      tl.to('#plate', { opacity: 0, duration: 0.28, ease: 'power2.in' }, 1.34);

      /* 焊接成方块：过曝闪一下再落定 */
      tl.fromTo('#cube-wrap', { scale: 0.34, opacity: 0, filter: 'brightness(3.2)' },
        { scale: 1, opacity: 1, filter: 'brightness(1)', duration: 0.62, ease: 'expo.out' }, 1.5);
      tl.fromTo('#shock', { scale: 0.18, opacity: 0.85 },
        { scale: 2.7, opacity: 0, duration: 0.95, ease: 'power2.out' }, 1.62);

      /* 场景 1 · breathe：幕底黄铜光极慢呼吸 */
      tl.to('.glow-a', { scale: 1.14, opacity: 0.72, duration: 2.2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
      tl.to('#cube', { boxShadow: 'inset 0 2px 0 rgba(240,208,128,0.45), inset 0 0 0 2px rgba(200,160,60,0.8), 0 0 130px rgba(200,160,60,0.45)', duration: 1.1, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.5);

      /* 场景 2 · build：镜头后拉穿过纵深场（一次连续运镜，不是元素逐个入场） */
      tl.fromTo('#field', { z: -2600, rotationX: 6, rotationY: -2.6 },
        { z: 420, rotationX: 0, rotationY: 2.6, duration: 4.0, ease: 'power2.out' }, 2.66);
      tl.fromTo('#ghost', { scale: 1.34, opacity: 0 },
        { scale: 1, opacity: 0.13, duration: 1.9, ease: 'sine.out' }, 2.78);
      tl.fromTo('#hero', { scale: 1.55, opacity: 0, filter: 'brightness(2.4)' },
        { scale: 1, opacity: 1, filter: 'brightness(1)', duration: 0.85, ease: 'expo.out' }, 2.9);
      tl.fromTo('#tally', { x: -30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, 3.5);

      /* 计数：mentions 从 0 滚到 4200（两个小时的演讲里被反复提及） */
      const tallyObj = { v: 0 };
      tl.to(tallyObj, {
        v: 4200, duration: 2.6, ease: 'power2.inOut',
        onUpdate: () => {
          const el = document.getElementById('tally-value');
          if (el) el.textContent = Math.round(tallyObj.v).toLocaleString('en-US');
        },
      }, 3.5);

      /* 场景 2 · breathe：hero 方块极慢呼吸 + ghost 字缓慢漂移 */
      tl.to('#hero', { scale: 1.035, duration: 1.8, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 3.8);
      tl.to('#ghost', { x: 60, duration: 4.0, ease: 'sine.inOut' }, 2.8);


      /* ───────── 转场：domain-warp（有机噪声扭曲，不是几何图案） ───────── */
      window.__timelines = window.__timelines || {};
      const hasShader = !!(window.HyperShader && window.HyperShader.init);
      const composed = hasShader
        ? window.HyperShader.init({
            bgColor: '#0b0a08',
            accentColor: '#c8a03c',
            scenes: ['scene-1', 'scene-2'],
            transitions: [{ time: 2.6, shader: 'domain-warp', duration: 0.75, ease: 'power2.inOut' }],
            timeline: tl,
          })
        : tl;

      /* 兜底：万一 shader 包没加载出来，别把 scene-2 永远藏死 —— 退化成硬切 */
      if (!hasShader) {
        tl.set('#scene-1', { opacity: 0 }, 2.6);
        tl.set('#scene-2', { opacity: 1 }, 2.6);
      }

      window.__timelines['main'] = composed;
      composed.seek(0);
    </script>
  </body>
</html>
